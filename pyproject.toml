[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "wolvpay"
version = "1.0.0"
description = "Official Python SDK for the WolvPay cryptocurrency payment API."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "WolvPay", email = "support@wolvpay.com" }
]
keywords = ["wolvpay", "cryptocurrency", "payment", "invoice", "bitcoin", "crypto"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-mock>=3.0"]

[project.urls]
Homepage = "https://github.com/wolvpay/wolvpay-python"
Documentation = "https://wolvpay.com/docs"
Repository = "https://github.com/wolvpay/wolvpay-python"
Issues = "https://github.com/wolvpay/wolvpay-python/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["wolvpay*"]
